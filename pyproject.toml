[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rdr-engine"
version = "0.1.0"
description = "A domain-independent, multiple-classification ripple-down rule (MCRDR) engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
skill-compiler = ["google-genai>=2.22,<3", "pydantic>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdr_engine = ["prompts/*.md"]
trace2skill_bridge = ["prompts/*.md", "schemas/*.json"]
