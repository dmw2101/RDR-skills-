"type": "fragments", "ops": [{"id": "frag_4855ec1c707091a1", "text": "For blank-sensitive formula tasks, compute the branch explicitly: if the driving source cell is truly blank, write `None`; otherwise write the actual result such as `0`, `1`, a category label, or a lookup value. Never rely on `IF(...,\"\",...)` formulas to be recalculated later.\n", "short": "For blank-sensitive formula tasks, compute the branch expli…", "role": "instruction", "lines": [112, 112], "missing": false}], "summary": "For blank-sensitive formula tasks, compute the branch expli…"}, "evidence": [], "children": [], "stopping": false, "status": "live", "dead_reason": null, "notes": [], "can_match": true, "can_fail": true, "depth": 1, "path": [{"id": 0, "matched": true}]}, {"id": 11, "conditions": ["operation contains lookup_or_join"], "conditions_json": "[\n  {\n    \"field\": \"operation\",\n    \"op\": \"contains\",\n    \"value\": \"lookup_or_join\"\n  }\n]", "conclusion": {"type": "fragments", "ops": [{"id": "frag_48dce7e7bf3c49d9", "text": "For lookup/category tasks, locate both the input rows and the lookup table by headers and nearby labels. Support exact keys, numeric-looking keys, and interval/range tables; then fill every destination row that has a driving input, not just the first visible example.\n", "short": "For lookup/category tasks, locate both the input rows and t…", "role": "instruction", "lines": [114, 114], "missing": false}], "summary": "For lookup/category tasks, locate both the input rows and t…"}, "evidence": [], "children": [], "stopping": false, "status": "live", "dead_reason": null, "notes": [], "can_match": true, "can_fail": true, "depth": 1, "path": [{"id": 0, "matched": true}]}, {"id": 12, "conditions": ["operation contains every_nth_row"], "conditions_json": "[\n  {\n    \"field\": \"operation\",\n    \"op\": \"contains\",\n    \"value\": \"every_nth_row\"\n  }\n]", "conclusion": {"type": "fragments", "ops": [{"id": "frag_b5b45ce318049509", "text": "For “every nth row” or OFFSET-style tasks, infer the source column, first source row, and step from the provided examples or formulas, then copy the actual source values into the requested output range as literals.\n", "short": "For “every nth row” or OFFSET-style tasks, infer the source…", "role": "instruction", "lines": [116, 116], "missing": false}], "summary": "For “every nth row” or OFFSET-style tasks, infer the source…"}, "evidence": [], "children": [], "stopping": false, "status": "live", "dead_reason": null, "notes": [], "can_match": true, "can_fail": true, "depth": 1, "path": [{"id": 0, "matched": true}]}, {"id": 13, "conditions": ["operation contains schedule_or_calendar"], "conditions_json": "[\n  {\n    \"field\": \"operation\",\n    \"op\": \"contains\",\n    \"value\": \"schedule_or_calendar\"\n  }\n]", "conclusion": {"type": "fragments", "ops": [{"id": "frag_e2e07b7c23569b37", "text": "For schedule/calendar fill tasks, build a cycle-day-to-periods mapping from the schedule/template area first, then fill the daily rows across all requested class columns based on each row’s cycle day. Preserve repeated/double periods exactly as shown by the template; do not leave formulas in the schedule cells.\n", "short": "For schedule/calendar fill tasks, build a cycle-day-to-peri…", "role": "instruction", "lines": [118, 118], "missing": false}], "summary": "For schedule/calendar fill tasks, build a cycle-day-to-peri…"}, "evidence": [], "children": [], "stopping": false, "status": "live", "dead_reason": null, "notes": [], "can_match": true, "can_fail": true, "depth": 1, "path": [{"id": 0, "matched": true}]}, {"id": 14, "conditions": ["operation contains formula_or_macro"], "conditions_json": "[\n  {\n    \"field\": \"operation\",\n    \"op\": \"contains\",\n    \"value\": \"formula_or_macro\"\n  }\n]", "conclusion": {"type": "fragments", "ops": [{"id": "frag_80debc01b333a10e", "text": "For INDEX/MATCH problems where the first row works but subsequent rows fail, treat row labels, column/year headers, region/type criteria, and expense/category labels as a multi-key lookup. Fill the whole result matrix with values from the source data table, using cached `data_only` values when source cells are formulas.\n", "short": "For INDEX/MATCH problems where the first row works but subs…", "role": "instruction", "lines": [120, 120], "missing": false}], "summary": "For INDEX/MATCH problems where the first row works but subs…"}, "evidence": [], "children": [], "stopping": false, "status": "live", "dead_reason": null, "notes": [], "can_match": true, "can_fail": true, "depth": 1, "path": [{"id": 0, "matched": true}]}, {"id": 15, "conditions": ["operation contains formula_or_macro"], "conditions_json": "[\n  {\n    \"field\": \"operation\",\n    \"op\": \"contains\",\n    \"value\": \"formula_or_macro\"\n  }\n]", "conclusion": {"type": "fragments", "ops": [{"id": "frag_ca1244a7f075493d", "text": "For multi-step macro/VBA-style requests, implement every stated operation in the workbook, not just the first deletion/filtering step. Re-read the numbered requirements before saving and verify later computed columns, totals, and derived fields as well as the obvious filtered rows.\n", "short": "For multi-step macro/VBA-style requests, implement every st…", "role": "instruction", "lines": [122, 122], "missing": false}], "summary": "For multi-step macro/VBA-style requests, implement every st…"}, "evidence": [], "children": [], "stopping": false, "status": "live", "dead_reason": null, "notes": [], "can_match": true, "can_fail": true, "depth": 1, "path": [{"id": 0, "matched": true}]}, {"id": 16, "conditions": ["operation contains aggregation_or_summary"], "conditions_json": "[\n  {\n    \"field\": \"operation\",\n    \"op\": \"contains\",\n    \"value\": \"aggregation_or_summary\"\n  }\n]", "conclusion": {"type": "fragments", "ops": [{"id": "frag_3bd3328f15ab71b6", "text": "When a target range includes special rows such as `Total`, `Grand Total`, `min`, `max`, constraints, headers, or blank separators, do not apply ordinary row logic blindly to those rows. Compute totals as aggregates when indicated, and leave constraint/header/blank cells untouched unless explicitly requested.\n", "short": "When a target range includes special rows such as `Total`,…", "role": "instruction", "lines": [124, 124], "missing": false}], "summary": "When a target range includes special rows such as `Total`,…"}, "evidence": [], "children": [], "stopping": false, "status": "live", "dead_reason": null, "notes": [], "can_match": true, "can_fail": true, "depth": 1, "path": [{"id": 0, "matched": true}]}, {"id": 17, "conditions": ["operation contains residual_balancing"], "conditions_json": "[\n  {\n    \"field\": \"operation\",\n    \"op\": \"contains\",\n    \"value\": \"residual_balancing\"\n  }\n]", "conclusion": {"type": "fragments", "ops": [{"id": "frag_b2ad0325e2ab6822", "text": "For residual-balancing tasks, identify data rows separately from min/max constraint rows. Add positive residuals from unit 1 toward unit 5 without exceeding max values; subtract negative residuals from unit 5 toward unit 1 without going below min values; update only the unit cells in actual data rows.\n", "short": "For residual-balancing tasks, identify data rows separately…", "role": "instruction", "lines": [126, 126], "missing": false}], "summary": "For residual-balancing tasks, identify data rows separately…"}, "evidence": [], "children": [], "stopping": false, "status": "live", "dead_reason": null, "notes": [], "can_match": true, "can_fail": true, "depth": 1, "path": [{"id": 0, "matched": true}]}, {"id": 18, "conditions": ["operation contains date_or_time"], "conditions_json": "[\n  {\n    \"field\": \"operation\",\n    \"op\": \"contains\",\n    \"value\": \"date_or_time\"\n  }\n]", "conclusion": {"type": "fragments", "ops": [{"id": "frag_f305321413cecf00", "text": "For time-threshold rows, decide per row whether it is a normal data row or a summary row. Normal rows use the before/after threshold rule; summary rows should aggregate the computed normal-row results if the workbook labels or examples indicate a total.\n", "short": "For time-threshold rows, decide per row whether it is a nor…", "role": "instruction", "lines": [128, 128], "missing": false}], "summary": "For time-threshold rows, decide per row whether it is a nor…"}, "evidence": [], "children": [], "stopping": false, "status": "live", "dead_reason": null, "notes": [], "can_match": true, "can_fail": true, "depth": 1, "path": [{"id": 0, "matched": true}]}]}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const byId = new Map(DATA.nodes.map(n => [n.id, n]));
  const rootId = DATA.meta.root_id;
  const NW = 250, NH = 58, DNH = 30, COLGAP = 70, ROWGAP = 14, PAD = 24;
  const height = id => byId.get(id).status === "dead" ? DNH : NH;
  const collapsed = new Set();
  let hideDead = DATA.hide_unreachable, selected = rootId, zoom = 1;

  const $ = id => document.getElementById(id);
  const el = (tag, attrs = {}, text) => {
    const e = tag === "svg" || ["g","rect","text","path","circle","title"].includes(tag)
      ? document.createElementNS("http://www.w3.org/2000/svg", tag) : document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;

  // ---- header -----------------------------------------------------------
  $("title").textContent = DATA.title;
  $("source").textContent = DATA.source;
  const s = DATA.stats;
  const statItems = [["Nodes", s.nodes], ["Reachable", s.live], ["Unreachable", s.dead],
    ["Possible terminals", s.terminals], ["Stopping rules", s.stops], ["Leaves", s.leaves], ["Max depth", s.depth]];
  if (s.orphan) statItems.push(["Disconnected", s.orphan]);
  for (const [k, v] of statItems) {
    const sp = el("span"); sp.append(k + ": "); sp.append(el("b", {}, String(v))); $("stats").append(sp);
  }
  if (DATA.warnings.length) {
    const w = $("warnings"); w.hidden = false;
    const ul = el("ul"); DATA.warnings.forEach(t => ul.append(el("li", {}, t))); w.append(ul);
  }
  $("hideDead").checked = hideDead;
  $("hideDead").onchange = e => { hideDead = e.target.checked; render(); };
  $("expand").onclick = () => { collapsed.clear(); render(); };
  $("collapse").onclick = () => {
    // Fold every unreachable node so each dead subtree shows as one grey box.
    DATA.nodes.forEach(n => { if (n.status === "dead") collapsed.add(n.id); });
    render();
  };
  const setZoom = z => { zoom = Math.min(2, Math.max(0.3, z)); $("zoomReset").textContent = Math.round(zoom * 100) + "%"; render(); };
  $("zoomIn").onclick = () => setZoom(zoom * 1.2);
  $("zoomOut").onclick = () => setZoom(zoom / 1.2);
  $("zoomReset").onclick = () => setZoom(1);
  $("fit").onclick = () => { fit(0.25); centreRoot(); };
  function fit(min) {
    const c = $("canvas"), vb = $("svg").viewBox.baseVal;
    setZoom(Math.max(min, Math.min(1, c.clientWidth / vb.width, c.clientHeight / vb.height)));
  }
  function centreRoot() {
    const c = $("canvas"), p = layout().get(rootId);
    c.scrollLeft = 0;
    c.scrollTop = Math.max(0, (p.y + PAD) * zoom - c.clientHeight / 2);
  }

  // ---- layout -----------------------------------------------------------
  // Children in evaluation (insertion) order, top to bottom.
  function kids(n, all) {
    const out = [];
    for (const c of n.children) {
      if (!byId.has(c)) continue;
      if (!all && hideDead && byId.get(c).status === "dead") continue;
      out.push(c);
    }
    return out;
  }
  function layout() {
    const pos = new Map(); let row = 0; const seen = new Set();
    const place = (id, depth) => {
      if (seen.has(id)) return null; seen.add(id);
      const n = byId.get(id);
      const ch = collapsed.has(id) ? [] : kids(n, false);
      const ys = ch.map(c => place(c, depth + 1)).filter(y => y !== null);
      let y;  // vertical centre
      if (!ys.length) { y = row + height(id) / 2; row += height(id) + ROWGAP; }
      else y = (ys[0] + ys[ys.length - 1]) / 2;
      pos.set(id, { x: depth * (NW + COLGAP), y, kids: ch });
      return y;
    };
    place(rootId, 0);
    return pos;
  }

  // ---- render -----------------------------------------------------------
  function render() {
    const pos = layout();
    const svg = $("svg"); svg.replaceChildren();
    let maxX = 0, maxY = 0;
    pos.forEach((p, id) => { maxX = Math.max(maxX, p.x + NW); maxY = Math.max(maxY, p.y + height(id) / 2); });
    const W = maxX + PAD * 2 + 20, H = maxY + PAD * 2;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("width", W * zoom); svg.setAttribute("height", H * zoom);
    const root = el("g", { transform: `translate(${PAD},${PAD})` }); svg.append(root);
    const edges = el("g"), nodesG = el("g"); root.append(edges, nodesG);
    const onPath = new Set((byId.get(selected)?.path || []).map(p => p.id));

    pos.forEach((p, id) => {
      const n = byId.get(id);
      for (const c of p.kids) {
        const q = pos.get(c); if (!q) continue;
        const child = byId.get(c), dead = child.status === "dead";
        const cls = (child.stopping ? "s" : "t") + (dead ? " dead" : "");
        const x1 = p.x + NW, y1 = p.y, x2 = q.x, y2 = q.y, mx = (x1 + x2) / 2;
        edges.append(el("path", { class: "edge " + cls, d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}` }));
      }
    });

    pos.forEach((p, id) => {
      const n = byId.get(id);
      const flagged = n.status === "live" && n.notes.length;
      const cls = ["node", id === rootId ? "root" : "", n.status === "dead" ? "dead" : "", n.stopping ? "stop" : "",
        flagged ? "flag" : "", id === selected ? "selected" : "", onPath.has(id) ? "onpath" : ""].join(" ");
      const h = height(id), dead = n.status === "dead";
      const g = el("g", { class: cls, transform: `translate(${p.x},${p.y - h / 2})`, tabindex: 0 });
      g.append(el("title", {}, n.dead_reason || n.notes.join("\n") || `Node #${id}`));
      g.append(el("rect", { class: "box", width: NW, height: h, rx: 8 }));
      const cond = n.conditions.length ? n.conditions.join(" ∧ ") : (id === rootId ? "root · always true" : "always true");
      if (dead) {  // compact: one line, details in the side panel
        g.append(el("text", { class: "nid", x: 10, y: 19 }, "#" + id));
        g.append(el("text", { class: "cond", x: 44, y: 19 }, clip(cond, 27)));
      } else {
        g.append(el("text", { class: "nid", x: 10, y: 17 }, "#" + id + (flagged ? "  ⚠ " + (n.can_match ? "always true" : "never true") : "")));
        g.append(el("text", { class: "cond", x: 10, y: 34 }, clip(cond, 32)));
        g.append(el("text", { class: "concl", x: 10, y: 50 }, clip(n.conclusion.summary, 40)));
      }
      const all = kids(n, false);
      if (all.length) {
        const fx = NW, fy = h / 2;
        const fold = el("g");
        fold.append(el("circle", { class: "fold", cx: fx, cy: fy, r: 8 }));
        fold.append(el("text", { class: "foldtxt", x: fx, y: fy }, collapsed.has(id) ? "+" : "−"));
        fold.addEventListener("click", e => { e.stopPropagation(); collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id); render(); });
        g.append(fold);
      }
      g.addEventListener("click", () => select(id));
      g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(id); } });
      nodesG.append(g);
    });
  }

  // ---- detail panel -----------------------------------------------------
  function select(id) {
    selected = id;
    // Make sure the selected node is visible.
    for (const p of byId.get(id).path) collapsed.delete(p.id);
    if (hideDead && byId.get(id).status === "dead") { hideDead = false; $("hideDead").checked = false; }
    render(); showDetail(id);
  }
  function showDetail(id) {
    const n = byId.get(id), d = $("detail"); d.replaceChildren();
    d.append(el("h2", {}, `Node #${id}` + (id === rootId ? " (root default)" : n.stopping ? " (stopping rule)" : "")));
    const pills = el("div");
    pills.append(el("span", { class: "pill " + n.status }, n.status === "live" ? "reachable" : n.status === "dead" ? "unreachable" : "disconnected"));
    if (n.status === "live" && !n.can_match) pills.append(el("span", { class: "pill flag" }, "never true"));
    if (n.status === "live" && n.can_match && !n.can_fail && n.conditions.length) pills.append(el("span", { class: "pill flag" }, "always true"));
    d.append(pills);
    if (n.dead_reason) d.append(el("div", { class: "note dead" }, n.dead_reason));
    n.notes.forEach(t => d.append(el("div", { class: "note" }, t)));

    d.append(el("h3", {}, "Conditions (all must hold)"));
    if (!n.conditions.length) d.append(el("div", { class: "empty" }, "None: always true."));
    else { const ul = el("ul"); n.conditions.forEach(c => { const li = el("li"); li.append(el("code", {}, c)); ul.append(li); }); d.append(ul); }

    d.append(el("h3", {}, "Conclusion"));
    if (id === rootId) d.append(el("div", { class: "empty" }, "Reported only when no child of the root fires."));
    if (n.conclusion.type === "stop") {
      d.append(el("div", { class: "note" }, "Stopping rule: when it fires, its parent's conclusion is not reported and nothing replaces it."));
    } else if (n.conclusion.type === "fragments") {
      if (!n.conclusion.ops.length) d.append(el("div", { class: "empty" }, "No fragments."));
      for (const op of n.conclusion.ops) {
        const box = el("div", { class: "frag" }), head = el("div", { class: "head" });
        head.append(el("span", { class: "fid" }, op.id));
        if (op.lines && op.lines[0] != null) head.append(el("span", { class: "fid" }, `lines ${op.lines[0]}–${op.lines[1]}`));
        box.append(head);
        if (op.text) box.append(el("pre", {}, op.text.replace(/\s+$/, "")));
        else if (op.missing) box.append(el("div", { class: "empty" }, "Not found in the fragment catalogue."));
        d.append(box);
      }
      if (!DATA.fragments_loaded) d.append(el("div", { class: "empty" }, "No fragment catalogue loaded. Pass --fragments to show the text."));
    } else d.append(el("pre", {}, n.conclusion.json));

    d.append(el("h3", {}, "Route from root"));
    if (!n.path.length) d.append(el("div", { class: "empty" }, "This is the root."));
    else {
      const ol = el("ol", { class: "path" });
      for (const step of n.path) {
        const li = el("li"), a = el("a", {}, "#" + step.id);
        a.onclick = () => select(step.id);
        const sn = byId.get(step.id);
        li.append(a, " ", el("code", {}, sn.conditions.join(" ∧ ") || "always"), " → ",
          el("span", { class: "m t" }, "fires"));
        ol.append(li);
      }
      const last = el("li"); last.append(el("b", {}, "#" + id)); ol.append(last);
      d.append(ol);
    }

    d.append(el("h3", {}, `Children (${n.children.length})`));
    if (!n.children.length) d.append(el("div", { class: "empty" }, "None: when this node fires it reports its conclusion."));
    const ch = el("ul");
    for (const c of n.children) {
      const li = el("li"), a = el("a", { href: "#" }, "#" + c);
      a.onclick = e => { e.preventDefault(); select(c); }; li.append(a);
      if (byId.get(c).stopping) li.append(el("span", { class: "empty" }, "  (stopping rule)"));
      if (byId.get(c).status === "dead") li.append(el("span", { class: "empty" }, "  (unreachable)"));
      ch.append(li);
    }
    d.append(ch);

    d.append(el("h3", {}, `Evidence (${n.evidence.length})`));
    if (n.evidence.length) d.append(el("pre", {}, JSON.stringify(n.evidence, null, 2)));
    else d.append(el("div", { class: "empty" }, "No stored cases."));

    d.append(el("h3", {}, "Raw conditions"));
    d.append(el("pre", {}, n.conditions_json));

    d.append(el("h3", {}, "Tree"));
    const dl = el("dl", { class: "meta" });
    for (const [k, v] of Object.entries(DATA.meta)) dl.append(el("dt", {}, k), el("dd", {}, typeof v === "object" ? JSON.stringify(v) : String(v)));
    for (const [k, v] of Object.entries(DATA.domains)) dl.append(el("dt", {}, "domain: " + k), el("dd", {}, v.join(", ")));
    d.append(dl);
  }

  render(); showDetail(rootId);
  fit(0.6); centreRoot();
})();
</script>
</body>
</html>
